name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Package DMG
        run: make dmg

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          DMG_FILE="build/CopyQMac-${VERSION}.dmg"
          if [ ! -f "${DMG_FILE}" ]; then
            echo "Expected DMG at ${DMG_FILE} was not found" >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "${DMG_FILE}" \
            --title "CopyQmac ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --prerelease
